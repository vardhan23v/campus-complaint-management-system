# ---------------------------------------------------------------------------
# Nitte Resolve application settings
# ---------------------------------------------------------------------------

# Folder where complaint images are stored. It must be OUTSIDE the deployed
# web application, so an uploaded file can never be served or executed
# directly by Tomcat; images are streamed by AttachmentServlet after a
# permission check. Leave empty to use  <user.home>/campus-complaint-uploads
upload.directory=

# Largest accepted image, in bytes (5 MB).
upload.maxBytes=5242880

# Prefix of the human readable complaint code, e.g. NIT-2026-00001.
complaint.codePrefix=NIT
